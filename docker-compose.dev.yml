version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: toolpadi_dev_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: toolpadi_dev
      POSTGRES_USER: toolpadi_dev
      POSTGRES_PASSWORD: devpassword
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toolpadi_dev -d toolpadi_dev"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_dev_data:
